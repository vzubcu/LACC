name: Validate skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Helper tests
        run: python3 -m unittest discover -s tests -v
      - name: Installer integration
        run: python3 tests/install_smoke.py
      - name: Remote catalog installation
        env:
          SKILLS_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tests/install_smoke.py --source "https://github.com/${GITHUB_REPOSITORY}/tree/${SKILLS_SOURCE_REF}"
